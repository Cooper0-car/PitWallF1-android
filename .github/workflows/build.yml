name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PitwallF1.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PitwallF1.apk --title "Pitwall F1 (최신 빌드 #${{ github.run_number }})" --notes "PitwallF1.apk 를 폰에서 다운로드해서 설치하세요."

      - uses: actions/upload-artifact@v4
        with:
          name: PitwallF1-apk
          path: PitwallF1.apk
